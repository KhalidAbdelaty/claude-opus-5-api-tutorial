# The app hardcodes a light surface, so pin the theme instead of following the
# operating system. Without this, a dark-mode machine gets Streamlit's light
# text on those surfaces and the inputs read as blank.
[theme]
base = "light"
primaryColor = "#D97757"
backgroundColor = "#FAF9F5"
secondaryBackgroundColor = "#F0EEE6"
textColor = "#1F1E1D"
linkColor = "#BE5D3B"
codeBackgroundColor = "#F0EEE6"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
